# Apache MPM prefork configuration
#
# Tuned for a container with 4 GB RAM.  mod_php requires mpm_prefork because
# it is not thread-safe; each child process handles one request at a time.
#
# Memory budget
# -------------
#   Assumed RSS per worker : ~20 MB  (SimpleSAMLphp + PHP + Apache overhead)
#   Target worker count    : 200
#   Peak RSS               : 200 × 20 MB = ~4 GB
#
# Reference: https://httpd.apache.org/docs/2.4/mod/mpm_common.html

<IfModule mpm_prefork_module>
    #
    # StartServers: number of server processes to start at launch.
    # A modest value avoids a cold-start spike while still being immediately
    # ready to handle a small burst of requests.
    #
    StartServers            5

    #
    # MinSpareServers / MaxSpareServers: idle worker target range.
    # Apache continuously adjusts the pool to keep spare (idle) workers in this
    # range.  Keeping MinSpareServers low avoids wasting memory at idle; keeping
    # MaxSpareServers reasonable prevents retaining too many idle processes after
    # a traffic spike subsides.
    #
    MinSpareServers         5
    MaxSpareServers         20

    #
    # ServerLimit: hard upper bound on the number of processes Apache will ever
    # create.  Must be >= MaxRequestWorkers.  Raising this value requires a full
    # Apache restart (not just graceful reload).
    #
    ServerLimit             200

    #
    # MaxRequestWorkers: maximum simultaneous requests.  Set to match the memory
    # budget above.  No new connections are accepted once this ceiling is reached.
    #
    MaxRequestWorkers       200

    #
    # MaxConnectionsPerChild: requests a single worker handles before recycling.
    # Recycling workers periodically prevents slow memory leaks from accumulating
    # indefinitely.  0 disables recycling entirely.
    #
    MaxConnectionsPerChild  10000
</IfModule>
