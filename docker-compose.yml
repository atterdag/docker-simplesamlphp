---
# docker-compose.yml
#
# Starts SimpleSAMLphp with the most common configuration options.
#
# Override any environment variable shown below to customise the deployment.
# Mount your SSL certificates, SP key/cert, and IdP metadata as volumes.
#
# Quick start:
#   docker compose up --build
#
# For production, supply real certificates and override credentials:
#   SIMPLESAMLPHP_ADMIN_PASSWORD=<secret> docker compose up

services:
  memcached:
    image: memcached:alpine
    restart: unless-stopped

  simplesamlphp:
    build:
      context: .
      args:
        SIMPLESAMLPHP_VERSION: "2.5.0"

    depends_on:
      - memcached

    # -----------------------------------------------------------------------
    # Apache / network configuration
    # These map to the Apache 'Define' directives via docker-entrypoint.sh.
    # -----------------------------------------------------------------------
    environment:
      DOMAIN_NAME:  ${DOMAIN_NAME:-se.lemche.net}
      SERVER_NAME:  ${SERVER_NAME:-simplesamlphp}
      # The following can be left unset; the entrypoint will derive them:
      #SERVER_ALIAS:         ${SERVER_NAME}
      #FQDN:                 ${SERVER_NAME}.${DOMAIN_NAME}
      #WEBMASTER:            webmaster@${DOMAIN_NAME}
      #SSL_CERTIFICATE_FILE: /etc/ssl/certs/${FQDN}.crt
      #SSL_PRIVATE_KEY_FILE: /etc/ssl/private/${FQDN}.key

      # -----------------------------------------------------------------------
      # SimpleSAMLphp SP configuration
      # -----------------------------------------------------------------------
      # Entity ID for this SP (defaults to https://<FQDN>/simplesaml/…)
      #SIMPLESAMLPHP_SP_ENTITY_ID: https://simplesamlphp.se.lemche.net/simplesaml/...

      # Filenames relative to /var/simplesamlphp/cert/
      SIMPLESAMLPHP_SP_PRIVATEKEY:  ${SIMPLESAMLPHP_SP_PRIVATEKEY:-sp.key}
      SIMPLESAMLPHP_SP_CERTIFICATE: ${SIMPLESAMLPHP_SP_CERTIFICATE:-sp.crt}

      # Require signed assertions and signed response messages from the IdP
      SIMPLESAMLPHP_SP_WANT_ASSERTIONS_SIGNED: ${SIMPLESAMLPHP_SP_WANT_ASSERTIONS_SIGNED:-true}
      SIMPLESAMLPHP_SP_WANT_MESSAGE_SIGNED:    ${SIMPLESAMLPHP_SP_WANT_MESSAGE_SIGNED:-true}

      # Admin password (CHANGE THIS in production)
      SIMPLESAMLPHP_ADMIN_PASSWORD: ${SIMPLESAMLPHP_ADMIN_PASSWORD:-admin}

      # Secret salt (auto-generated per container start if not set)
      #SIMPLESAMLPHP_SECRET_SALT: <random-string>

      # Technical contact
      SIMPLESAMLPHP_TECHNICAL_CONTACT_NAME:  ${SIMPLESAMLPHP_TECHNICAL_CONTACT_NAME:-Administrator}
      SIMPLESAMLPHP_TECHNICAL_CONTACT_EMAIL: ${SIMPLESAMLPHP_TECHNICAL_CONTACT_EMAIL:-}

      # Timezone
      SIMPLESAMLPHP_TIMEZONE: ${SIMPLESAMLPHP_TIMEZONE:-UTC}

      # -----------------------------------------------------------------------
      # Logging – file handler with a shared named volume
      #
      # Set SIMPLESAMLPHP_LOGGING_HANDLER to 'file' to write SimpleSAMLphp and
      # Apache logs to SIMPLESAMLPHP_LOG_DIR instead of stdout/stderr.
      # Each container gets its own sub-directory named after its HOSTNAME
      # (container short-ID), keeping replicas uniquely identifiable.
      #
      # Switch back to 'errorlog' (the image default) to restore the standard
      # 'docker logs' behaviour.
      # -----------------------------------------------------------------------
      SIMPLESAMLPHP_LOGGING_HANDLER: ${SIMPLESAMLPHP_LOGGING_HANDLER:-file}
      SIMPLESAMLPHP_LOG_DIR: ${SIMPLESAMLPHP_LOG_DIR:-/var/simplesamlphp/log}

      # -----------------------------------------------------------------------
      # Session store – use memcache backed by the memcached service above.
      # The image default is 'phpsession' (works without a memcached server);
      # docker-compose overrides it to 'memcache' because the memcached service
      # is available in this stack. Set to 'phpsession' to revert.
      # -----------------------------------------------------------------------
      SIMPLESAMLPHP_STORE_TYPE: ${SIMPLESAMLPHP_STORE_TYPE:-memcache}
      MEMCACHE_SERVER_HOST:     ${MEMCACHE_SERVER_HOST:-memcached}
      MEMCACHE_SERVER_PORT:     ${MEMCACHE_SERVER_PORT:-11211}

      # -----------------------------------------------------------------------
      # Automated metadata management (metarefresh + cron modules)
      #
      # Set SIMPLESAMLPHP_METAREFRESH_METADATA_URL to the URL of the
      # federation or IdP aggregate metadata XML you want to fetch automatically.
      #
      # Set SIMPLESAMLPHP_CRON_SECRET to a stable random value so that the
      # cron trigger URL is predictable across container restarts:
      #   openssl rand -hex 32
      #
      # Trigger a refresh manually (while the container is running):
      #   docker compose exec simplesamlphp metarefresh.sh
      #
      # Or as a one-shot standalone container (stops after refresh):
      #   docker run --rm \
      #     -e SIMPLESAMLPHP_CRON_SECRET=<secret> \
      #     -e SIMPLESAMLPHP_METAREFRESH_METADATA_URL=<url> \
      #     [-v ./metadata:/var/simplesamlphp/metadata] \
      #     <image> metarefresh.sh
      # -----------------------------------------------------------------------
      SIMPLESAMLPHP_CRON_SECRET:                ${SIMPLESAMLPHP_CRON_SECRET:-}
      SIMPLESAMLPHP_METAREFRESH_CRON_TAG:       ${SIMPLESAMLPHP_METAREFRESH_CRON_TAG:-metarefresh}
      SIMPLESAMLPHP_METAREFRESH_METADATA_URL:   ${SIMPLESAMLPHP_METAREFRESH_METADATA_URL:-}
      SIMPLESAMLPHP_METAREFRESH_OUTPUT_DIR:     ${SIMPLESAMLPHP_METAREFRESH_OUTPUT_DIR:-/var/simplesamlphp/metadata/metarefresh}
      SIMPLESAMLPHP_METAREFRESH_EXPIRE_AFTER:   ${SIMPLESAMLPHP_METAREFRESH_EXPIRE_AFTER:-345600}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # -----------------------------------------------------------------------
      # Log volume – stores SimpleSAMLphp and Apache logs from all containers.
      # Each container creates a uniquely-named sub-directory under the mount
      # point (named after its HOSTNAME / container short-ID), so logs from
      # multiple replicas can coexist on a single volume without overwriting
      # each other.
      # -----------------------------------------------------------------------
      - simplesamlphp-logs:/var/simplesamlphp/log

      # -----------------------------------------------------------------------
      # IdP metadata – mount your own saml20-idp-remote.php here.
      # Uncomment and adjust the line below to supply IdP metadata.
      #
      # Docker bind-mount example:
      #   - ./my-idp-metadata.php:/var/simplesamlphp/metadata/saml20-idp-remote.php:ro
      #
      # Kubernetes ConfigMap (see README for full spec):
      #   name: idp-metadata, mountPath: /var/simplesamlphp/metadata/saml20-idp-remote.php
      #
      # When no file is mounted the image's default (empty) metadata file is used.
      # -----------------------------------------------------------------------
      #- ./my-idp-metadata.php:/var/simplesamlphp/metadata/saml20-idp-remote.php:ro

      # -----------------------------------------------------------------------
      # SP signing key and certificate (SAML signing/encryption, NOT TLS).
      # Place sp.key and sp.crt (or whatever names you set in
      # SIMPLESAMLPHP_SP_PRIVATEKEY / SIMPLESAMLPHP_SP_CERTIFICATE) in this
      # directory.
      # Uncomment and adjust to supply SP credentials.
      #
      # Kubernetes Secret (see README):
      #   name: sp-certs, mountPath: /var/simplesamlphp/cert
      # -----------------------------------------------------------------------
      #- ./certs/sp:/var/simplesamlphp/cert:ro

      # -----------------------------------------------------------------------
      # Apache TLS certificate and private key.
      # The paths inside the container are determined by SSL_CERTIFICATE_FILE
      # and SSL_PRIVATE_KEY_FILE (defaults:
      #   /etc/ssl/certs/<FQDN>.crt
      #   /etc/ssl/private/<FQDN>.key).
      # Uncomment and adjust to supply TLS credentials.
      #
      # Kubernetes Secret (see README):
      #   name: tls-secret, mountPath: /etc/ssl/certs / /etc/ssl/private
      # -----------------------------------------------------------------------
      #- ./certs/ssl/certs:/etc/ssl/certs:ro
      #- ./certs/ssl/private:/etc/ssl/private:ro

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  simplesamlphp-logs:
    driver: local
