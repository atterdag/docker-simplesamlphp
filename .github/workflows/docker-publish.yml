name: Build and publish container image

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write   # required to push to GitHub Container Registry

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Extract SimpleSAMLphp version from Dockerfile
        id: ssp_version
        run: |
          SSP_VERSION=$(grep -E '^ARG SIMPLESAMLPHP_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]"'"'" )
          if [[ -z "${SSP_VERSION}" ]]; then
            echo "::error::Could not extract SIMPLESAMLPHP_VERSION from Dockerfile"
            exit 1
          fi
          if ! [[ "${SSP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Extracted version '${SSP_VERSION}' does not match expected semver format (X.Y.Z)"
            exit 1
          fi
          echo "version=${SSP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=ssp-${{ steps.ssp_version.outputs.version }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
