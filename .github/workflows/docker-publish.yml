name: Build and publish container image

on:
  push:
    branches:
      - main

env:
  IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID }}/docker-simplesamlphp

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  build-and-push:
    name: Build and push to GCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Authenticate to Google Cloud using Workload Identity Federation.
      # Required repository variables / secrets:
      #   vars.GCP_PROJECT_ID          – GCP project that owns the GCR registry
      #   vars.GCP_WORKLOAD_IDENTITY_PROVIDER – full WIF provider resource name
      #     e.g. projects/123456789/locations/global/workloadIdentityPools/MY-POOL/providers/MY-PROVIDER
      #   vars.GCP_SERVICE_ACCOUNT     – service account email that has roles/storage.admin
      #     on the GCS bucket backing GCR (or roles/artifactregistry.writer for AR)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker to use gcloud credentials
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Extract SimpleSAMLphp version from Dockerfile
        id: ssp_version
        run: |
          SSP_VERSION=$(grep -E '^ARG SIMPLESAMLPHP_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]"'"'" )
          if [[ -z "${SSP_VERSION}" ]]; then
            echo "::error::Could not extract SIMPLESAMLPHP_VERSION from Dockerfile"
            exit 1
          fi
          if ! [[ "${SSP_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Extracted version '${SSP_VERSION}' does not match expected semver format (X.Y.Z)"
            exit 1
          fi
          echo "version=${SSP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=ssp-${{ steps.ssp_version.outputs.version }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
