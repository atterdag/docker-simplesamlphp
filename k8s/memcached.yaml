---
# k8s/memcached.yaml
#
# Memcached Deployment and ClusterIP Service.
# SimpleSAMLphp connects to the Service by its DNS name ("memcached") within
# the same namespace.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: simplesamlphp
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memcached
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: memcached
          image: memcached:alpine
          ports:
            - name: memcache
              containerPort: 11211
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: memcache
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: memcache
            initialDelaySeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: simplesamlphp
  labels:
    app.kubernetes.io/name: memcached
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: memcached
  ports:
    - name: memcache
      port: 11211
      targetPort: memcache
      protocol: TCP
